[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factorio-maxxing"
version = "0.1.0"
description = "Human-Assisted Factorio Harness - how much human guidance a budget LLM needs to reach frontier-model performance in Factorio"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "skai8468" }]
# No runtime dependencies. Phases 1-4 run entirely offline against MockFactorioEnv.
# FLE enters at Phase 5 (build-plan.md section 19) as an optional extra, not before.
dependencies = []

[project.optional-dependencies]
# Live model calls only. Phases 1-4 offline work needs none of this.
api = [
    "openai>=1.0",
    "anthropic>=1.0",
]
# Live Factorio. Install inside WSL2, where Docker and the cluster live (D29, D30).
#
# FLE is pinned to a commit, not a version: 0.4.8 exists only on GitHub (PyPI stops at
# 0.4.3, and upstream tags no release after it), and every run of the eval grid must use
# the same FLE (D61). FLE pins a2a-sdk==1.1 itself, so the a2a-sdk<1 pin that 0.4.3
# needed is gone - it would now make the install unresolvable.
#
# After installing, run scripts/patch_fle.sh: FLE still ships a Factorio 2.0.73 server
# image, and the client needs 2.0.77 (D34).
fle = [
    "factorio-learning-environment[eval] @ git+https://github.com/JackHopkins/factorio-learning-environment@e2a829d22a635a9a111d21bf5523e09e903ae145",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "openai>=1.0",
    "anthropic>=1.0",
    # Editing the codebook workbook (docs/codebook-v0.xlsx). The harness reads it
    # with the standard library and never needs this (D69).
    "openpyxl>=3.1",
]

# Hatchling refuses a direct git reference in metadata without this, even where the
# fle extra is never installed.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["factorio_maxxing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 90
target-version = "py313"
# Ruff formats Python blocks inside Markdown. docs/ is authority rank 2
# (CLAUDE.md Source of truth) and must never be rewritten by a linter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
