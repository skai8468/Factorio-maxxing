[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factorio-maxxing"
version = "0.1.0"
description = "Human-Assisted Factorio Harness - how much human assistance an LLM agent needs to climb the Factorio technology tree"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "skai8468" }]
# No runtime dependencies. Phases 1-4 run entirely offline against MockFactorioEnv.
# FLE enters at Phase 5 (build-plan.md section 19) as an optional extra, not before.
dependencies = []

[project.optional-dependencies]
# Live model calls only. Phases 1-4 offline work needs none of this.
api = [
    "openai>=1.0",
]
# Live Factorio. Install inside WSL2, where Docker and the cluster live (D29, D30).
#
# The a2a-sdk pin is load-bearing, not tidiness. FLE 0.4.3 declares a2a-sdk with no
# constraint, so a fresh resolve takes 1.x, where a2a.types no longer exports TextPart,
# Message, AgentCard or Role. Six FLE modules import those names, including
# agents/agent_abc.py, which fle.env.gym_env.registry pulls in - so make_factorio_env
# dies at import. See docs/fle-integration.md.
fle = [
    "factorio-learning-environment[eval]>=0.4.3",
    "a2a-sdk<1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "openai>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["factorio_maxxing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 90
target-version = "py313"
# Ruff formats Python blocks inside Markdown. docs/ is authority rank 2
# (CLAUDE.md Source of truth) and must never be rewritten by a linter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
